<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ネオン - PA-PI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            color: #333;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        h1 {
            margin: 20px 0;
            font-size: 24px;
        }
        .artist-names {
            font-size: 16px;
            margin: 10px 0;
            color: #555;
        }
        .button-container {
            margin: 20px 0;
        }
        .button-container a, .button-container button {
            text-decoration: none;
            color: white;
            background-color: black;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            font-size: 16px;
            display: inline-block;
            border: none;
            cursor: pointer;
        }
        .photo-gallery {
            margin-top: 20px;
        }
        .photo-gallery img {
            width: 80%;
            margin: 10px 0;
            border-radius: 8px;
        }
        footer {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
    <script>
        function displayPhotos() {
            const photoLinks = [
                "https://www.dropbox.com/scl/fi/hcoczl3rq5oip8sihrqta/InShot_20240829_173815492.jpg?rlkey=ug8zse3aacroioqlm594rgiit&st=yob4x4a1&dl=0&raw=1",
                "https://www.dropbox.com/scl/fi/u2exfzrgx3nlcbh9qzwuu/InShot_20240829_173726442.jpg?rlkey=uoxuo2fxepb2cpedx0wuzr8xd&st=ik1jndk4&dl=0&raw=1",
                "https://www.dropbox.com/scl/fi/aj2ba9solfk7qe8hk1sb5/InShot_20240829_173755526.jpg?rlkey=qmfquwohc1buh5hxh97mdpgdi&st=t66g254f&dl=0&raw=1"
            ];
            const gallery = document.getElementById("photo-gallery");
            gallery.innerHTML = "";  // Clear previous content
            photoLinks.forEach(link => {
                const img = document.createElement("img");
                img.src = link;
                gallery.appendChild(img);
            });
        }
    </script>
</head>
<body>
    <!-- Image -->
    <a href="https://www.dropbox.com/scl/fi/hcoczl3rq5oip8sihrqta/InShot_20240829_173815492.jpg?rlkey=ug8zse3aacroioqlm594rgiit&st=yob4x4a1&dl=0" target="_blank">
        <img src="https://www.dropbox.com/scl/fi/hcoczl3rq5oip8sihrqta/InShot_20240829_173815492.jpg?rlkey=ug8zse3aacroioqlm594rgiit&st=yob4x4a1&dl=0&raw=1" alt="ネオン Image">
    </a>

    <!-- Title -->
    <h1>ネオン</h1>
    <p class="artist-names">PA-PI</p>

    <!-- Buttons -->
    <div class="button-container">
        <a href="https://www.dropbox.com/scl/fi/eh1xjotnyc1ygx2zlub9u/.mp3?rlkey=dj51n1tjyf8ymbj6q7gr7wday&st=497a386q&dl=0" target="_blank">Audio</a>
        <a href="https://li.sten.to/PA-PI-NEON" target="_blank">Stream</a>
        <a href="https://youtu.be/mCumm3sL_nA?si=bLWIpkO3JeyGYGB7" target="_blank">Video</a>
        <button onclick="displayPhotos()">Photo</button>
    </div>

    <!-- Photo Gallery -->
    <div id="photo-gallery" class="photo-gallery"></div>

    <!-- Footer -->
    <footer>© Salt Music Enter.</footer>
</body>
</html>

</html>
